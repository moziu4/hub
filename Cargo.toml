[package]
name = "hub"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenv = "0.15"
actix-web = "4.9.0"
env_logger = "0.11.5"
serde_json = "1.0.128"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12.9", features = ["json"] }
actix-cors = "0.7.0"
perms = { git = "https://github.com/moziu4/perms", branch = "master" }
redis = { version = "0.27.6", features = ["tokio-comp"] }
async-nats = "0.38.0"
futures = "0.3.31"
tracing = "0.1.40"
tokio = { version = "1", features = ["full"] }

